$Application1 = {
    Class = RealTimeApplication
    +Functions = {
        Class = ReferenceContainer
        +GAM1 = {
            Class = IOGAM
            InputSignals = {
               TimerSignal = {
                   DataSource = Timer
                   Frequency = 100.0
                   Type = uint64
               }
               Channel9 = {
                   DataSource = AdcInput
                   Type = uint16
               }
               Channel10 = {
                   DataSource = AdcInput
                   Type = uint16
               }                                
            }
            OutputSignals = {
               ToLogger = {
                   DataSource = Logger
                   Type = uint64
               }
               AdcChannel9 = {
                   DataSource = Logger
                   Type = uint16
               }
               AdcChannel10 = {
                   DataSource = Logger
                   Type = uint16
               }
            }
        }
        +GAM2 = {
            Class = MathOperationGAM
            Operation = "+"
            InputSignals = {
               Counter_1 = {
                   DataSource = DDB1
                   Type = uint16
                   Default = 0
               }
               One = {
                   DataSource = DDB1
                   Type = uint16
                   Default = 1
               }
            }
            OutputSignals = {
               Counter_t = {
                   DataSource = DDB1
                   Type = uint16
               }
            }
        }
        +GAM3 = {
            Class = MathOperationGAM
            Operation = "&"
            InputSignals = {
               Counter_t = {
                   DataSource = DDB1
                   Type = uint16
               }
               Mask12b = {
                   DataSource = DDB1
                   Type = uint16
                   Default = 0xFFF
               }
            }
            OutputSignals = {
               Counter = {
                   DataSource = DDB1
                   Type = uint16
               }
            }
        }
        +GAM4 = {
            Class = IOGAM
            InputSignals = {
               CounterCh1 = {
                   Alias = Counter
                   DataSource = DDB1
                   Type = uint16
               }
               CounterCh2 = {
                   Alias = Counter
                   DataSource = DDB1
                   Type = uint16
               }
               Counter = {
                   DataSource = DDB1
                   Type = uint16
               }
               CounterLog = {
                   Alias = Counter
                   DataSource = DDB1
                   Type = uint16
               }
            }
            OutputSignals = {
                Channel1 = {
                    DataSource = DacOutput
                    Type = uint16
                }
                Channel2 = {
                    DataSource = DacOutput
                    Type = uint16
                }
                Counter_1 = {
                    DataSource = DDB1
                    Type = uint16
                }
                Counter_Log = {
                    DataSource = Logger
                    Type = uint16
                }
            }
        }
    }
    +States = {
        Class = ReferenceContainer
        +State1 = {
            Class = RealTimeState
            +Threads = {
                Class = ReferenceContainer
                +Thread1 = {
                    Class = RealTimeThread
                    Functions = { GAM1, GAM2, GAM3, GAM4 }
                }
            }
        }
    }
    +Data = {
        DefaultDataSource = DDB1
        Class = ReferenceContainer
        +DDB1 = {
            AllowNoProducers = 1
            Class = GAMDataSource
        }
        +Timer = {
            Class = TimerDataSource
            Phase = 0
            UseThread = 0
        }
        +Logger = {
            CyclePeriod = 10
            Class = LoggerDataSource
        }
        +AdcInput = {
            Class = AdcDmaDataSource
            Identifier = hadc1
            TriggerTimer = htim5
            ConversionFrequency = 100
            NumberOfBuffers = 5
            Signals = {
                Channel3 = {
                    Type = uint16
                }
                Channel6 = {
                    Type = uint16
                }
                Channel9 = {
                    Type = uint16
                }
                Channel10 = {
                    Type = uint16
                }                                
            }
        }
        +DacOutput = {
            Class = DacDmaDataSource
            Identifier = hdac
            TriggerTimer = htim7
            ConversionFrequency = 100
            NumberOfBuffers = 5
            Signals = {
                Channel1 = {
                    Type = uint16
                }
                Channel2 = {
                    Type = uint16
                }
            }
        }
    }
    +Scheduler = {
        Class = BasicScheduler
    }
}

