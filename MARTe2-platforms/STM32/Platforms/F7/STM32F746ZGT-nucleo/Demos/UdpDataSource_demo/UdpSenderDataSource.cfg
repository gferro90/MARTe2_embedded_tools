
+UdpInterface = {
    Class = UdpStream
    LocalIpAddress = {10, 0, 0, 3}
    LocalPort = 8888
}

$Application1 = {
    Class = RealTimeApplication
    +Functions = {
        Class = ReferenceContainer
        +GAM1 = {
            Class = IOGAM
            InputSignals = {
               TimerSignal = {
                   DataSource = Timer
                   Frequency = 10.0
                   Type = uint32
               }
            }
            OutputSignals = {
               ToLogger = {
                   DataSource = UdpSender
                   Type = uint32
               }
            }
        }
    }
    +States = {
        Class = ReferenceContainer
        +State1 = {
            Class = RealTimeState
            +Threads = {
                Class = ReferenceContainer
                +Thread1 = {
                    Class = RealTimeThread
                    Functions = { GAM1 }
                }
            }
        }
    }
    +Data = {
        DefaultDataSource = DDB1
        Class = ReferenceContainer
        +Timings = {
            Class = TimingDataSource
        }
        +Timer = {
            Class = TimerDataSource
            Phase = 0
            UseThread = 0
        }
        +UdpSender = {
            Class = UdpDataSource::UdpSenderDataSource
            Interface = UdpInterface
            IpAddress = {10, 0, 0, 4}
            Port = 8889
        }
    }
    +Scheduler = {
        TimingDataSource = Timings
        Class = BasicScheduler
    }
}
