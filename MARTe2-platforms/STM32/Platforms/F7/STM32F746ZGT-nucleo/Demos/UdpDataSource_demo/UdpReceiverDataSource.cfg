+UdpInterface = {
    Class = UdpStream
    LocalIpAddress = {10, 0, 0, 3}
    LocalPort = 8888
}

$Application1 = {
    Class = RealTimeApplication
    +Functions = {
        Class = ReferenceContainer
        +GAM1 = {
            Class = IOGAM
            InputSignals = {
               TimerSignal = {
                   DataSource = Timer
                   Frequency = 10.0
                   Type = uint64
               }
            }
            OutputSignals = {
               Timer = {
                   DataSource = Logger
                   Type = uint64
               }
            }
        }        
        +GAM2 = {
            Class = IOGAM
            InputSignals = {
                Amplitude = {
                    DataSource = UdpReceiver
                    Type = float32
                    Default = 1
                }
                Phase = {
                    DataSource = UdpReceiver
                    Type = float32
                    Default = 0
                }
                Offset = {
                    DataSource = UdpReceiver
                    Type = float32
                    Default = 0
                }
                Frequency = {
                    DataSource = UdpReceiver
                    Type = float32
                    Default = 1
                }        
            }
            OutputSignals = {
                Amplitude = {
                    DataSource = Logger
                    Type = float32
                }
                Phase = {
                    DataSource = Logger
                    Type = float32
                }
                Offset = {
                    DataSource = Logger
                    Type = float32
                }
                Frequency = {
                    DataSource = Logger
                    Type = float32
                }        
            }
        }
    }
    +States = {
        Class = ReferenceContainer
        +State1 = {
            Class = RealTimeState
            +Threads = {
                Class = ReferenceContainer
                +Thread1 = {
                    Class = RealTimeThread
                    Functions = { GAM1 GAM2 }
                }
            }
        }
    }
    +Data = {
        DefaultDataSource = DDB1
        Class = ReferenceContainer
        +Timings = {
            Class = TimingDataSource
        }
        +Logger = {
            //CyclePeriod = 10
            Class = LoggerDataSource
        }
        +Timer = {
            Class = TimerDataSource
            Phase = 0
            UseThread = 0
        }        
        +UdpReceiver = {
            Class = UdpDataSource::UdpReceiverDataSource
            Interface = UdpInterface
            IpAddress = {10, 0, 0, 3}
            Port = 8888
        }  
    }
    +Scheduler = {
        TimingDataSource = Timings
        Class = BasicScheduler
    }
}

