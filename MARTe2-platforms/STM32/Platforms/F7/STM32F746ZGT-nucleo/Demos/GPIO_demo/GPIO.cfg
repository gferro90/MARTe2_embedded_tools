$Application1 = {
    Class = RealTimeApplication
    +Functions = {
        Class = ReferenceContainer
        +GAM1 = {
            Class = IOGAM
            InputSignals = {
               TimerSignal = {
                   DataSource = Timer
                   Frequency = 1.0
                   Type = uint32
               }
               Mask = {
                   DataSource = DDB1
                   Type = uint32
                   Default = 0x1
               }
            }
            OutputSignals = {
               ToLogger = {
                   DataSource = Logger
                   Type = uint32
               }
               Mask = {
                   DataSource = GPIOLED
                   Type = uint32
               }
            }
        }
    }
    +States = {
        Class = ReferenceContainer
        +State1 = {
            Class = RealTimeState
            +Threads = {
                Class = ReferenceContainer
                +Thread1 = {
                    Class = RealTimeThread
                    Functions = { GAM1 }
                }
            }
        }
    }
    +Data = {
        DefaultDataSource = DDB1
        Class = ReferenceContainer
        +Timings = {
            Class = TimingDataSource
        }
        +DDB1 = {
            Class = GAMDataSource
            AllowNoProducers = 1
        }
        +Timer = {
            Class = TimerDataSource
            Phase = 0
            UseThread = 0
        }
        +Logger = {
            Class = LoggerDataSource
        }
        +GPIOLED = {
            Class = GPIO
            GpioIdentifier = GPIOB
        }        
    }
    +Scheduler = {
        TimingDataSource = Timings
        Class = BasicScheduler
    }
}
