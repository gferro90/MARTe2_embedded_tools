+Udp = {
    Class = UdpStream
    LocalIpAddress = {10, 0, 0, 3}
    LocalPort = 8888
}

$Application1 = {
    Class = RealTimeApplication
    +Functions = {
        Class = ReferenceContainer
        +ReadGAM = {
            Class = IOGAM
            InputSignals = {
                Time = {
                    DataSource = Timer
                    Frequency = 100.0
                    Type = uint64
                }
                References = {
                    DataSource = Ur
                    Type = int32
                    NumberOfElements = 3
                }
                Counter0 = {
                    Type = int32
                    DataSource = Encoder0
                }
                Counter1 = {
                    Type = int32
                    DataSource = Encoder1
                }
                Counter2 = {
                    Type = int32
                    DataSource = Encoder2
                }
            }
            OutputSignals = {
                Tstmp = {
                    DataSource = DB
                    Type = uint64
                }
                Reference0 = {
                    DataSource = DB
                    Type = int32
                }  
                Reference1 = {
                    DataSource = DB
                    Type = int32
                }  
                Reference2 = {
                    DataSource = DB
                    Type = int32
                }
                Position0 = {
                    DataSource = DB
                    Type = int32
                }
                Position1 = {
                    DataSource = DB
                    Type = int32
                }
                Position2 = {
                    DataSource = DB
                    Type = int32
                }
            }
        }
        +MotorControlGAM = {
            Class = MotorControlGAM
            Kp = 10
            Ki = 0
            Kd = 0
            MaxOutput = 24000
            MaxPwm = 1000
            InputSignals = {
                Tstmp = {
                    DataSource = DB
                    Type = uint64
                }            
                Reference0 = {
                    DataSource = DB
                    Type = int32
                }
                Reference1 = {
                    DataSource = DB
                    Type = int32
                }  
                Reference2 = {
                    DataSource = DB
                    Type = int32
                }
                Position0 = {
                    DataSource = DB
                    Type = int32
                }
                Position1 = {
                    DataSource = DB
                    Type = int32
                }
                Position2 = {
                    DataSource = DB
                    Type = int32
                }
            }
            OutputSignals = {
                GPIOE = {
                    DataSource = Gpio
                    Type = uint32
                }
                Out0 = {
                    DataSource = DB
                    Type = float32
                    DirectionPin = 12
                }
                Out1 = {
                    DataSource = DB
                    Type = float32
                    DirectionPin = 13
                }
                Out2 = {
                    DataSource = DB
                    Type = float32
                    DirectionPin = 14
                }                
                Pwm0 = {
                    DataSource = Pwm
                    Type = uint32
                }
                Pwm1 = {
                    DataSource = Pwm
                    Type = uint32
                }
                Pwm2 = {
                    DataSource = Pwm
                    Type = uint32
                }
            }
        }
        +WriteGAM = {
            Class = IOGAM
            InputSignals = {
                Tstmp = {
                    DataSource = DB
                    Type = uint64
                }               
                Position0 = {
                    DataSource = DB
                    Type = int32
                }
                Position1 = {
                    DataSource = DB
                    Type = int32
                }
                Position2 = {
                    DataSource = DB
                    Type = int32
                }
                Out0 = {
                    DataSource = DB
                    Type = float32
                }
                Out1 = {
                    DataSource = DB
                    Type = float32
                }
                Out2 = {
                    DataSource = DB
                    Type = float32
                }                  
            }
            OutputSignals = {
                Tstmp = {
                    DataSource = Logger
                    Type = uint64
                }            
                Position0 = {
                    DataSource = Us
                    Type = int32
                }
                Position1 = {
                    DataSource = Us
                    Type = int32
                }
                Position2 = {
                    DataSource = Us
                    Type = int32
                }
                Control0 = {
                    DataSource = Us
                    Type = float32
                }
                Control1 = {
                    DataSource = Us
                    Type = float32
                }
                Control2 = {
                    DataSource = Us
                    Type = float32
                }                
            }
        }
    }
    +States = {
        Class = ReferenceContainer
        +State1 = {
            Class = RealTimeState
            +Threads = {
                Class = ReferenceContainer
                +Thread1 = {
                    Class = RealTimeThread
                    Functions = { ReadGAM, MotorControlGAM, WriteGAM }
                }
            }
        }
    }
    +Data = {
        DefaultDataSource = DB
        Class = ReferenceContainer
        +DB = {
            Class = GAMDataSource
        }
        +Timer = {
            Class = TimerDataSource
        }
        +Logger = {
            Class = LoggerDataSource
        }        
        +Gpio = {
            Class = GpioDataSource
            NumberOfInputs = 0
            Signals = {
                GPIOE = {
                    Type = uint32
                }
            }
        }
        +Ur = {
            Class = UdpDataSource::UdpReceiverDataSource
            Interface = Udp
            IpAddress = {10, 0, 0, 3}
            Port = 8888
        }  
        +Us = {
            Class = UdpDataSource::UdpSenderDataSource
            Interface = Udp
            IpAddress = {10, 0, 0, 4}
            Port = 7777
        }
        +Pwm = {
            Class = PwmDataSource
            Identifier = htim2
            Signals = {
                Pwm0 = {
                    Channel = 0
                    Type = uint32
                }
                Pwm1 = {
                    Channel = 2
                    Type = uint32
                }
                Pwm2 = {
                    Channel = 3
                    Type = uint32
                }
            }
        }
        +Encoder0 = {
            Class = EncoderDataSource
            Identifier = htim1
            Signals = {
                Reset0 = {
                   Type = uint8
                }
                Counter0 = {
                   Type = int32
                }                
            }
        }
        +Encoder1 = {
            Class = EncoderDataSource
            Identifier = htim3
            Signals = {
                Reset1 = {
                   Type = uint8
                }
                Counter1 = {
                   Type = int32
                }                
            }
        }
        +Encoder2 = {
            Class = EncoderDataSource
            Identifier = htim4
            Signals = {
                Reset2 = {
                   Type = uint8
                }
                Counter2 = {
                   Type = int32
                }                
            }
        }
    }
    +Scheduler = {
        Class = BasicScheduler
    }
}

