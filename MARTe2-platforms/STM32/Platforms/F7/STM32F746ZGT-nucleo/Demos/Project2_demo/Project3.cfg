+Udp = {
    Class = UdpStream
    LocalIpAddress = {10, 0, 0, 2}
    LocalPort = 8888
}

$Application1 = {
    Class = RealTimeApplication
    +Functions = {
        Class = ReferenceContainer
        +MotorControl = {
            Class = IOGAM
            InputSignals = {
                Time = {
                    DataSource = Timer
                    Frequency = 100.0
                    Type = uint64
                }        
                References = {
                    DataSource = Ur
                    Type = uint32
                    NumberOfElements = 6
                }
            }
            OutputSignals = {
                Time = {
                    DataSource = DDB1
                    Type = uint64
                }        
                Pwm0 = {
                    DataSource = Pwm_0
                    Type = uint32
                }
                Pwm1 = {
                    DataSource = Pwm_0
                    Type = uint32
                }
                Pwm2 = {
                    DataSource = Pwm_0
                    Type = uint32
                }
                Pwm3 = {
                     DataSource = Pwm_1
                     Type = uint32
                }
                Pwm4 = {
                     DataSource = Pwm_1
                     Type = uint32
                }
                Pwm5 = {
                     DataSource = Pwm_2
                     Type = uint32
                }
            }
        }
    }
    +States = {
        Class = ReferenceContainer
        +State1 = {
            Class = RealTimeState
            +Threads = {
                Class = ReferenceContainer
                +Thread1 = {
                    Class = RealTimeThread
                    Functions = { MotorControl }
                }
            }
        }
    }
    +Data = {
        DefaultDataSource = DB
        Class = ReferenceContainer
        +Timer = {
            Class = TimerDataSource
        }
        +DDB1 = {
            Class = GAMDataSource
        }
        +Ur = {
            Class = UdpDataSource::UdpReceiverDataSource
            Interface = Udp
            IpAddress = {10, 0, 0, 2}
            Port = 8888
        }  
        +Pwm_0 = {
            Class = PwmDataSource
            Identifier = htim2
            Period = 20000
            Signals = {
                Pwm0 = {
                    Channel = 0
                    Type = uint32
                }
                Pwm1 = {
                    Channel = 2
                    Type = uint32
                }
                Pwm2 = {
                    Channel = 3
                    Type = uint32
                }
            }
        }
        +Pwm_1 = {
            Class = PwmDataSource
            Identifier = htim9
            Period = 40000
            Signals = {
                Pwm3 = {
                    Channel = 0
                    Type = uint32
                }
                Pwm4 = {
                    Channel = 1
                    Type = uint32
                }
            }
        }            
        +Pwm_2 = {
            Class = PwmDataSource
            Identifier = htim12
            Period = 20000
            Signals = {
                Pwm5 = {
                    Channel = 1
                    Type = uint32
                }
            }
        } 
    }
    +Scheduler = {
        Class = BasicScheduler
    }
}

