+Udp = {
    Class = UdpStream
    LocalIpAddress = {10, 0, 0, 3}
    LocalPort = 8888
}

$Application1 = {
    Class = RealTimeApplication
    +Functions = {
        Class = ReferenceContainer
        +ReadGAM = {
            Class = IOGAM
            InputSignals = {
                Time = {
                    DataSource = Timer
                    Frequency = 100.0
                    Type = uint64
                }
                References = {
                    DataSource = Ur
                    Type = int32
                    NumberOfElements = 3
                }
                Counter0 = {
                    Type = int32
                    DataSource = Encoder0
                }
                Counter1 = {
                    Type = int32
                    DataSource = Encoder1
                }
                Counter2 = {
                    Type = int32
                    DataSource = Encoder2
                }                  
            }
            OutputSignals = {
                Tstmp = {
                    DataSource = DB
                    Type = uint64
                }
                References = {
                    DataSource = DB
                    Type = int32
                    NumberOfElements = 3
                }  
                Positions = {
                    DataSource = DB
                    Type = int32
                    NumberOfElements = 3
                }
            }
        }
        +MotorControlGAM = {
            Class = MotorControlGAM
            Kp = 10
            Ki = 0
            Kd = 0
            MaxOutput = 24000
            MaxPwm = 1000
            DeadBand = 50
            InputSignals = {
                Tstmp = {
                    DataSource = DB
                    Type = uint64
                }            
                References = {
                    DataSource = DB
                    Type = int32
                    NumberOfElements = 3
                }
                Positions = {
                    DataSource = DB
                    Type = int32
                    NumberOfElements = 3
                }
            }
            OutputSignals = {
                GPIOG = {
                    DataSource = Gpio
                    Type = uint32
                    DirectionPins = { 0, 1, 3 }
                }
                Outputs = {
                    DataSource = DB
                    Type = float32
                    NumberOfElements = 3
                }
                Pwm0 = {
                    DataSource = Pwm
                    Type = uint32
                    PwmMin = 95
                }
                Pwm1 = {
                    DataSource = Pwm
                    Type = uint32
                    PwmMin = 95
                }
                Pwm2 = {
                    DataSource = Pwm
                    Type = uint32
                    PwmMin = 95
                }
            }
        }
        +WriteGAM = {
            Class = IOGAM
            InputSignals = {
                Positions = {
                    DataSource = DB
                    Type = int32
                    NumberOfElements = 3
                }
                Outputs = {
                    DataSource = DB
                    Type = float32
                    NumberOfElements = 3
                }
            }
            OutputSignals = {
                Positions = {
                    DataSource = Us
                    Type = int32
                    NumberOfElements = 3
                }
                Controls = {
                    DataSource = Us
                    Type = float32
                    NumberOfElements = 3
                }
            }
        }
    }
    +States = {
        Class = ReferenceContainer
        +State1 = {
            Class = RealTimeState
            +Threads = {
                Class = ReferenceContainer
                +Thread1 = {
                    Class = RealTimeThread
                    Functions = { ReadGAM, MotorControlGAM, WriteGAM }
                }
            }
        }
    }
    +Data = {
        DefaultDataSource = DB
        Class = ReferenceContainer
        +DB = {
            Class = GAMDataSource
        }
        +Timer = {
            Class = TimerDataSource
        }
        +Logger = {
            Class = LoggerDataSource
        }        
        +Gpio = {
            Class = GpioDataSource
            NumberOfInputs = 0
            Signals = {
                GPIOG = {
                    Type = uint32
                }
            }
        }
        +Us = {
            Class = UdpDataSource::UdpSenderDataSource
            Interface = Udp
            IpAddress = {10, 0, 0, 4}
            Port = 7777
        }
        +Ur = {
            Class = UdpDataSource::UdpReceiverDataSource
            Interface = Udp
            IpAddress = {10, 0, 0, 3}
            Port = 8888
        }  
        +Pwm = {
            Class = PwmDataSource
            Identifier = htim2
            Signals = {
                Pwm0 = {
                    Channel = 0
                    Type = uint32
                }
                Pwm1 = {
                    Channel = 2
                    Type = uint32
                }
                Pwm2 = {
                    Channel = 3
                    Type = uint32
                }
            }
        }
        +Encoder0 = {
            Class = EncoderDataSource
            Identifier = htim1
            Invert = 1
            Signals = {
                Reset0 = {
                   Type = uint8
                }
                Counter0 = {
                   Type = int32
                }                
            }
        }
        +Encoder1 = {
            Class = EncoderDataSource
            Identifier = htim3
            Signals = {
                Reset1 = {
                   Type = uint8
                }
                Counter1 = {
                   Type = int32
                }                
            }
        }
        +Encoder2 = {
            Class = EncoderDataSource
            Identifier = htim4
            Signals = {
                Reset2 = {
                   Type = uint8
                }
                Counter2 = {
                   Type = int32
                }                
            }
        }
    }
    +Scheduler = {
        Class = BasicScheduler
    }
}

