$Application1 = {
    Class = RealTimeApplication
    +Functions = {
        Class = ReferenceContainer
        +GAM1 = {
            Class = IOGAM
            InputSignals = {
               TimerSignal = {
                   DataSource = Timer
                   Frequency = 10.0
                   Type = uint32
               }
               Counter = {
                   DataSource = Encoder
                   Type = int32
               }
            }
            OutputSignals = {
               ToLogger = {
                   DataSource = Logger
                   Type = uint32
               }
               Counter = {
                   DataSource = Logger
                   Type = int32
               }
            }
        }
    }
    +States = {
        Class = ReferenceContainer
        +State1 = {
            Class = RealTimeState
            +Threads = {
                Class = ReferenceContainer
                +Thread1 = {
                    Class = RealTimeThread
                    Functions = { GAM1 }
                }
            }
        }
    }
    +Data = {
        DefaultDataSource = DDB1
        Class = ReferenceContainer
        +Timer = {
            Class = TimerDataSource
            Phase = 0
            UseThread = 0
        }
        +Encoder = {
            Class = EncoderDataSource
            Identifier = htim1
            Signals = {
                Reset = {
                   Type = uint8
                }
                Counter = {
                   Type = int32
                }                
            }
        }        
        +Logger = {
            Class = LoggerDataSource
        }
    }
    +Scheduler = {
        TimingDataSource = Timings
        Class = BasicScheduler
    }
}
