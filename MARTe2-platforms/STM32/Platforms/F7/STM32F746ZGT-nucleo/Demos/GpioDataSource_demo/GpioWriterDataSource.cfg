$Application1 = {
    Class = RealTimeApplication
    +Functions = {
        Class = ReferenceContainer
        +GAM1 = {
            Class = IOGAM
            InputSignals = {
               TimerSignal = {
                   DataSource = Timer
                   Frequency = 10.0
                   Type = uint32
               }
               Mask = {
                   DataSource = DDB1
                   Type = uint32
                   Default = 16385
               }
               OneX = {
                   DataSource = DDB1
                   Type = uint32
                   Default = 16513 //PB1|PB7|PB14
               }
               Mask2 = {
                   Alias = Mask
                   DataSource = DDB1
                   Type = uint32
               }
            }
            OutputSignals = {
               ToLogger = {
                   DataSource = Logger
                   Type = uint32
               }
               Mask = {
                   DataSource = Logger
                   Type = uint32
               }
               One = {
                   DataSource = DDB1
                   Type = uint32
               }
               MaskGpio = {
                   DataSource = GPIOLED
                   Type = uint32
               }
            }
        }
        +GAM2 = {
            Class = MathOperationGAM
            Operation = "~"
            InputSignals = {
               Mask = {
                   DataSource = DDB1
                   Type = uint32
               }
            }
            OutputSignals = {
               MaskInv = {
                   DataSource = DDB1
                   Type = uint32
               }
            }
        }
        +GAM3 = {
            Class = MathOperationGAM
            Operation = "&"
            InputSignals = {
               MaskInv = {
                   DataSource = DDB1
                   Type = uint32
               }
               One = {
                   DataSource = DDB1
                   Type = uint32
               }
            }
            OutputSignals = {
               Mask = {
                   DataSource = DDB1
                   Type = uint32
               }
            }
        }
    }
    +States = {
        Class = ReferenceContainer
        +State1 = {
            Class = RealTimeState
            +Threads = {
                Class = ReferenceContainer
                +Thread1 = {
                    Class = RealTimeThread
                    Functions = { GAM1 GAM2 GAM3 }
                }
            }
        }
    }
    +Data = {
        DefaultDataSource = DDB1
        Class = ReferenceContainer
        +Timings = {
            Class = TimingDataSource
        }
        +DDB1 = {
            Class = GAMDataSource
            AllowNoProducers = 1
        }
        +Timer = {
            Class = TimerDataSource
            Phase = 0
            UseThread = 0
        }
        +Logger = {
            Class = LoggerDataSource
        }
        +GPIOLED = {
            Class = GPioDataSource::GpioWriter
            Identifier = GPIOB
        }        
    }
    +Scheduler = {
        TimingDataSource = Timings
        Class = BasicScheduler
    }
}
