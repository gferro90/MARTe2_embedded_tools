$Application1 = {
    Class = RealTimeApplication
    +Functions = {
        Class = ReferenceContainer
        +GAM1 = {
            Class = IOGAM
            InputSignals = {
               TimerSignal = {
                   DataSource = Timer
                   Frequency = 5.0
                   Type = uint32
               }
               Channel3 = {
                   DataSource = AdcInput
                   Type = uint32
               }
               Channel6 = {
                   DataSource = AdcInput
                   Type = uint32
               }
               Channel9 = {
                   DataSource = AdcInput
                   Type = uint32
               }
               Channel10 = {
                   DataSource = AdcInput
                   Type = uint32
               }                                
            }
            OutputSignals = {
               ToLogger = {
                   DataSource = Logger
                   Type = uint32
               }
               AdcChannel3 = {
                   DataSource = Logger
                   Type = uint32
               }
               AdcChannel6 = {
                   DataSource = Logger
                   Type = uint32
               }
               AdcChannel9 = {
                   DataSource = Logger
                   Type = uint32
               }
               AdcChannel10 = {
                   DataSource = Logger
                   Type = uint32
               }
            }
        }
    }
    +States = {
        Class = ReferenceContainer
        +State1 = {
            Class = RealTimeState
            +Threads = {
                Class = ReferenceContainer
                +Thread1 = {
                    Class = RealTimeThread
                    Functions = { GAM1 }
                }
            }
        }
    }
    +Data = {
        DefaultDataSource = DDB1
        Class = ReferenceContainer
        +Timings = {
            Class = TimingDataSource
        }
        +Timer = {
            Class = TimerDataSource
            Phase = 0
            UseThread = 0
        }
        +Logger = {
            Class = LoggerDataSource
        }
        +AdcInput = {
            Class = AdcDmaDataSource
            Identifier = hadc1
            Signals = {
                Channel3 = {
                    Type = uint32
                }
                Channel6 = {
                    Type = uint32
                }
                Channel9 = {
                    Type = uint32
                }
                Channel10 = {
                    Type = uint32
                }                                
            }
        }
    }
    +Scheduler = {
        TimingDataSource = Timings
        Class = BasicScheduler
    }
}

