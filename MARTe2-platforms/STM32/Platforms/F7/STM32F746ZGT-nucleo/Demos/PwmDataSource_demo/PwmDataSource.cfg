$Application1 = {
    Class = RealTimeApplication
    +Functions = {
        Class = ReferenceContainer
        +GAM1 = {
            Class = IOGAM
            InputSignals = {
               TimerSignal = {
                   DataSource = Timer
                   Frequency = 10.0
                   Type = uint32
               }
               DutyCycle = {
                   DataSource = DDB1
                   Type = uint32
                   Default = 0
               }
               DutyCycleToPwm = {
                   Alias = DutyCycle
                   DataSource = DDB1
                   Type = uint32
               }               
            }
            OutputSignals = {
               ToLogger = {
                   DataSource = Logger
                   Type = uint32
               }
               DutyCycle_1 = {
                   DataSource = DDB1
                   Type = uint32
               }
               DutyCycle = {
                   DataSource = Pwm
                   Type = uint32
               }
            }
        }
        +GAM2 = {
            Class = MathOperationGAM
            Operation = "+"
            InputSignals = {
               DutyCycle_1 = {
                   DataSource = DDB1
                   Type = uint32
               }
               One = {
                   DataSource = DDB1
                   Type = uint32
                   Default = 1
               }
            }
            OutputSignals = {
               DutyCycle_Cnt = {
                   DataSource = DDB1
                   Type = uint32
               }
            }
        }
        +GAM3 = {
            Class = MathOperationGAM
            Operation = "&"
            InputSignals = {
               DutyCycle_Cnt = {
                   DataSource = DDB1
                   Type = uint32
               }
               Mask10b = {
                   DataSource = DDB1
                   Type = uint32
                   Default = 0x3FF
               }
            }
            OutputSignals = {
               DutyCycle = {
                   DataSource = DDB1
                   Type = uint32
               }
            }
        }
    }
    +States = {
        Class = ReferenceContainer
        +State1 = {
            Class = RealTimeState
            +Threads = {
                Class = ReferenceContainer
                +Thread1 = {
                    Class = RealTimeThread
                    Functions = { GAM1, GAM2, GAM3 }
                }
            }
        }
    }
    +Data = {
        DefaultDataSource = DDB1
        Class = ReferenceContainer
        +Timer = {
            Class = TimerDataSource
            Phase = 0
            UseThread = 0
        }
        +DDB1 = {
            Class = GAMDataSource
            AllowNoProducers = 1
        }        
        +Logger = {
            Class = LoggerDataSource
        }
        +Pwm = {
            Class = PwmDataSource
            Identifier = htim2
            Signals = {
                DutyCycle = {
                    Type = uint32
                }
            }
        }
    }
    +Scheduler = {
        Class = BasicScheduler
    }
}
