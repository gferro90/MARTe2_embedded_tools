+Udp = {
    Class = UdpStream
    LocalIpAddress = {10, 0, 0, 3}
    LocalPort = 8888
}

$Application1 = {
    Class = RealTimeApplication
    +Functions = {
        Class = ReferenceContainer
        +IO = {
            Class = IOGAM
            InputSignals = {
                Time = {
                    DataSource = Timer
                    Frequency = 100.0
                    Type = uint64
                }
                Amp = {
                    DataSource = Ur
                    Type = float32
                    NumberOfElements = 2
                }
                Ph = {
                    DataSource = Ur
                    Type = float32
                    NumberOfElements = 2
                }                  
                Off = {
                    DataSource = Ur
                    Type = float32
                    NumberOfElements = 2
                }
                Freq = {
                    DataSource = Ur
                    Type = float32
                    NumberOfElements = 2
                }
                DO = {
                    DataSource = Ur
                    Type = uint32
                }                
                GPIOF = {
                    DataSource = Gpio
                }
                Ch3 = {
                    DataSource = Adc
                }
                Ch6 = {
                    DataSource = Adc
                }
                Ch9 = {
                    DataSource = Adc
                }
                Ch10 = {
                    DataSource = Adc
                }  
            }
            OutputSignals = {
                Tstmp = {
                    DataSource = DB
                    Type = uint64
                }
                Amp = {
                    DataSource = DB
                    Type = float32
                    NumberOfElements = 2
                }
                Ph = {
                    DataSource = DB
                    Type = float32
                    NumberOfElements = 2
                }                 
                Off = {
                    DataSource = DB
                    Type = float32
                    NumberOfElements = 2
                }
                Freq = {
                    DataSource = DB
                    Type = float32
                    NumberOfElements = 2
                }
                GPIOE = {
                    DataSource = Gpio
                }                
                DI = {
                    DataSource = Us
                    Type = uint32
                }
                Ch3 = {
                    DataSource = Us
                    Type = uint16
                }
                Ch6 = {
                    DataSource = Us
                    Type = uint16
                }
                Ch9 = {
                    DataSource = Us
                    Type = uint16
                }
                Ch10 = {
                    DataSource = Us
                    Type = uint16
                }
            }
        }
        +Sine = {
            Class = SineGeneratorGAM
            InputSignals = {
                Amp = {
                    DataSource = DB
                }
                Ph = {
                    DataSource = DB
                }
                Off = {
                    DataSource = DB
                }
                Freq = {
                    DataSource = DB
                }       
                Tstmp = {
                    DataSource = DB
                }
            }
            OutputSignals = {
                Ch1 = {
                    DataSource = Dac
                }
                Ch2 = {
                    DataSource = Dac
                }
            }
        }
    }
    +States = {
        Class = ReferenceContainer
        +State1 = {
            Class = RealTimeState
            +Threads = {
                Class = ReferenceContainer
                +Thread1 = {
                    Class = RealTimeThread
                    Functions = { IO, Sine }
                }
            }
        }
    }
    +Data = {
        DefaultDataSource = DB
        Class = ReferenceContainer
        +DB = {
            Class = GAMDataSource
        }
        +Timer = {
            Class = TimerDataSource
        }
        +Gpio = {
            Class = GpioDataSource
            NumberOfInputs = 1
            Signals = {
	            GPIOF = {
                    Type = uint32
                }
                GPIOE = {
                    Type = uint32
                }
            }
        }
        +Ur = {
            Class = UdpDataSource::UdpReceiverDataSource
            Interface = Udp
            IpAddress = {10, 0, 0, 3}
            Port = 8888
        }  
        +Us = {
            Class = UdpDataSource::UdpSenderDataSource
            Interface = Udp
            IpAddress = {10, 0, 0, 4}
            Port = 7777
        }
        +Adc = {
            Class = AdcDmaDataSource
            Identifier = hadc1
            TriggerTimer = htim5
            ConversionFrequency = 100
            NumberOfBuffers = 5
            Signals = {
                Ch3 = {
                    Type = uint16
                }
                Ch6 = {
                    Type = uint16
                }
                Ch9 = {
                    Type = uint16
                }
                Ch10 = {
                    Type = uint16
                }
            }
        }
        +Dac = {
            Class = DacDmaDataSource
            Identifier = hdac
            TriggerTimer = htim7
            ConversionFrequency = 100
            NumberOfBuffers = 5
            Signals = {
                Ch1 = {
                    Type = uint16
                }
                Ch2 = {
                    Type = uint16
                }
            }
        }
    }
    +Scheduler = {
        Class = BasicScheduler
    }
}

