+UdpInterface = {
    Class = UdpStream
    LocalIpAddress = {10, 0, 0, 3}
    LocalPort = 8888
}

$Application1 = {
    Class = RealTimeApplication
    +Functions = {
        Class = ReferenceContainer
        +Inputs = {
            Class = IOGAM
            InputSignals = {
                TimerSignal = {
                    DataSource = Timer
                    Frequency = 10.0
                    Type = uint64
                }
                Amplitude = {
                    DataSource = UdpReceiver
                    Type = float32
                    NumberOfElements = 2
                    NumberOfDimensions = 1
                }
                Phase = {
                    DataSource = UdpReceiver
                    Type = float32
                    NumberOfElements = 2
                    NumberOfDimensions = 1
                }
                Offset = {
                    DataSource = UdpReceiver
                    Type = float32
                    NumberOfElements = 2
                    NumberOfDimensions = 1
                }
                Frequency = {
                    DataSource = UdpReceiver
                    Type = float32
                    NumberOfElements = 2
                    NumberOfDimensions = 1
                }
                Channel3 = {
                    DataSource = AdcInput
                    Type = uint16
                }
                Channel6 = {
                    DataSource = AdcInput
                    Type = uint16
                }
                Channel9 = {
                    DataSource = AdcInput
                    Type = uint16
                }
                Channel10 = {
                    DataSource = AdcInput
                    Type = uint16
                }  
            }
            OutputSignals = {
                TimeStamp = {
                    DataSource = DDB1
                    Type = uint64
                }
                Amplitude = {
                    DataSource = DDB1
                    Type = float32
                    NumberOfElements = 2
                    NumberOfDimensions = 1
                }
                Phase = {
                    DataSource = DDB1
                    Type = float32
                    NumberOfElements = 2
                    NumberOfDimensions = 1
                }
                Offset = {
                    DataSource = DDB1
                    Type = float32
                    NumberOfElements = 2
                    NumberOfDimensions = 1
                }
                Frequency = {
                    DataSource = DDB1
                    Type = float32
                    NumberOfElements = 2
                    NumberOfDimensions = 1
                }
                Channel3 = {
                    DataSource = UdpSender
                    Type = uint16
                }
                Channel6 = {
                    DataSource = UdpSender
                    Type = uint16
                }
                Channel9 = {
                    DataSource = UdpSender
                    Type = uint16
                }
                Channel10 = {
                    DataSource = UdpSender
                    Type = uint16
                }
            }
        }
        +SineGeneratorGAM = {
            Class = SineGeneratorGAM
            InputMax = 1
            InputMin = -1
            OutputMin = 0
            OutputMax = 4095            
            InputSignals = {
                Amplitude = {
                    DataSource = DDB1
                    Type = float32
                    NumberOfElements = 2
                    NumberOfDimensions = 1
                }
                Phase = {
                    DataSource = DDB1
                    Type = float32
                    NumberOfElements = 2
                    NumberOfDimensions = 1
                }
                Offset = {
                    DataSource = DDB1
                    Type = float32
                    NumberOfElements = 2
                    NumberOfDimensions = 1
                }
                Frequency = {
                    DataSource = DDB1
                    Type = float32
                    NumberOfElements = 2
                    NumberOfDimensions = 1
                }       
                TimeStamp = {
                    DataSource = DDB1
                    Type = uint64
                }
            }
            OutputSignals = {
                Channel1 = {
                    DataSource = DacOutput
                    Type = uint16
                }
                Channel2 = {
                    DataSource = DacOutput
                    Type = uint16
                }
            }
        }
    }
    +States = {
        Class = ReferenceContainer
        +State1 = {
            Class = RealTimeState
            +Threads = {
                Class = ReferenceContainer
                +Thread1 = {
                    Class = RealTimeThread
                    Functions = { Inputs, SineGeneratorGAM }
                }
            }
        }
    }
    +Data = {
        DefaultDataSource = DDB1
        Class = ReferenceContainer
        +Timings = {
            Class = TimingDataSource
        }
        +DDB1 = {
            AllowNoProducers = 1
            Class = GAMDataSource
        }
        +Timer = {
            Class = TimerDataSource
            Phase = 0
            UseThread = 0
        }
        +Logger = {
            Class = LoggerDataSource
        }
        +UdpReceiver = {
            Class = UdpDataSource::UdpReceiverDataSource
            Interface = UdpInterface
            IpAddress = {10, 0, 0, 3}
            Port = 8888
        }  
        +UdpSender = {
            Class = UdpDataSource::UdpSenderDataSource
            Interface = UdpInterface
            IpAddress = {10, 0, 0, 4}
            Port = 7777
        }
        +AdcInput = {
            Class = AdcDmaDataSource
            Identifier = hadc1
            TriggerTimer = htim5
            ConversionFrequency = 10
            NumberOfBuffers = 5
            Signals = {
                Channel3 = {
                    Type = uint16
                }
                Channel6 = {
                    Type = uint16
                }
                Channel9 = {
                    Type = uint16
                }
                Channel10 = {
                    Type = uint16
                }                                
            }
        }
        +DacOutput = {
            Class = DacDmaDataSource
            Identifier = hdac
            TriggerTimer = htim7
            ConversionFrequency = 10
            NumberOfBuffers = 5
            Signals = {
                Channel1 = {
                    Type = uint16
                }
                Channel2 = {
                    Type = uint16
                }
            }
        }
    }
    +Scheduler = {
        TimingDataSource = Timings
        Class = BasicScheduler
    }
}

