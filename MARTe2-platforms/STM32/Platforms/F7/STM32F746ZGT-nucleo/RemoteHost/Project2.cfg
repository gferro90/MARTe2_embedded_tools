+HttpServiceA = {
    Class = HttpService
    AcceptTimeout = 1000
    Port = 8084
    Timeout = 0
    MaxNumberOfThreads = 10
    MinNumberOfThreads = 1
    ListenMaxConnections = 255
    WebRoot = WebRoot
    IsTextMode = 1
    ChunkSize = 32
    CPUs = 0x1
}

+StateMachine = {
    Class = StateMachine
    +INITIAL = {
        Class = ReferenceContainer
        +START = {
            Class = StateMachineEvent
            NextState = LOOP
            NextStateError = LOOP
            +StartHttpServer = {
                Class = Message
                Destination = HttpServiceA
                Function = Start
                Mode = ExpectsReply
            }             
            +PrepareNextStateMsg = {
                Class = Message
                Destination = EmbeddedInterface
                Mode = ExpectsReply
                Function = PrepareNextState
                +Parameters = {
                    Class = ConfigurationDatabase
                    param1 = State1
                }
            }
            +StartNextStateExecutionMsg = {
                Class = Message
                Destination = EmbeddedInterface
                Function = StartNextStateExecution
                Mode = ExpectsReply
            }
        }
    }
    +LOOP = {
        Class = ReferenceContainer
        +LOOP = {
            Class = StateMachineEvent
            NextState = LOOP
            NextStateError = LOOP
        }
    }
}


+EmbeddedInterface = {
    Class = RealTimeApplication
    +Functions = {
        Class = ReferenceContainer
        +Motor_Params = {
            Class = ConstantGAM
            OutputSignals = {
                ReferencePos0 = {
                    Type = int32
                    DataSource = DDB1
                    Default = 0
                }
                ReferencePos1 = {
                    Type = int32
                    DataSource = DDB1
                    Default = 0
                }
                ReferencePos2 = {
                    Type = int32
                    DataSource = DDB1
                    Default = 0
                }
                ReferencePos3 = {
                    Type = int32
                    DataSource = DDB1
                    Default = 0
                }
            }
        }
        +Sync = {
            Class = IOGAM
            InputSignals = {
                TimerSignal = {
                    DataSource = Timer
                    Frequency = 10.0
                    Type = uint64
                }
            }
            OutputSignals = {
                Timer = {
                    DataSource = DDB1
                    Type = uint64
                }
            }
        }
        +WriteUDP = {
            Class = IOGAM
            InputSignals = {
                ReferencePos0 = {
                    Type = int32
                    DataSource = DDB1
                    Default = 0
                }
                ReferencePos1 = {
                    Type = int32
                    DataSource = DDB1
                    Default = 0
                }
                ReferencePos2 = {
                    Type = int32
                    DataSource = DDB1
                    Default = 0
                }
                ReferencePos3 = {
                    Type = int32
                    DataSource = DDB1
                    Default = 0
                }                
            }
            OutputSignals = {
                References = {
                    DataSource = UdpSender
                    Type = int32
                    NumberOfElements = 4
                }            
            }
        }         
        +ReadUDP = {
            Class = IOGAM
            InputSignals = {
                EndSwitches = {
                    DataSource = UdpReceiver
                    Type = uint32
                }
                Positions = {
                    DataSource = UdpReceiver
                    Type = int32
                    NumberOfElements = 4
                }
                Controls = {
                    DataSource = UdpReceiver
                    Type = float32
                    NumberOfElements = 4
                }            
            }
            OutputSignals = {
                EndSwitches = {
                    DataSource = DDB1
                    Type = uint32
                }
                MeasuredPos0 = {
                    DataSource = DDB1
                    Type = int32
                }
                MeasuredPos1 = {
                    DataSource = DDB1
                    Type = int32
                }
                MeasuredPos2 = {
                    DataSource = DDB1
                    Type = int32
                }
                MeasuredPos3 = {
                    DataSource = DDB1
                    Type = int32
                }                
                Control0 = {
                    DataSource = DDB1
                    Type = float32
                }
                Control1 = {
                    DataSource = DDB1
                    Type = float32
                }
                Control2 = {
                    DataSource = DDB1
                    Type = float32
                }
                Control3 = {
                    DataSource = DDB1
                    Type = float32
                }
            }
        }        
        +Log = {
            Class = IOGAM
            InputSignals = {
                EndSwitches = {
                    DataSource = DDB1
                    Type = uint32
                }
                MeasuredPos0 = {
                    DataSource = DDB1
                    Type = int32
                }
                MeasuredPos1 = {
                    DataSource = DDB1
                    Type = int32
                }
                MeasuredPos2 = {
                    DataSource = DDB1
                    Type = int32
                }
                MeasuredPos3 = {
                    DataSource = DDB1
                    Type = int32
                }                
                Control0 = {
                    DataSource = DDB1
                    Type = float32
                }
                Control1 = {
                    DataSource = DDB1
                    Type = float32
                }
                Control2 = {
                    DataSource = DDB1
                    Type = float32
                }
                Control3 = {
                    DataSource = DDB1
                    Type = float32
                }                 
            }
            OutputSignals = {
                EndSwitches = {
                    DataSource = Logger
                    Type = uint32
                }
                MeasuredPos0 = {
                    DataSource = Logger
                    Type = int32
                }
                MeasuredPos1 = {
                    DataSource = Logger
                    Type = int32
                }
                MeasuredPos2 = {
                    DataSource = Logger
                    Type = int32
                }
                MeasuredPos3 = {
                    DataSource = Logger
                    Type = int32
                }                
                Control0 = {
                    DataSource = Logger
                    Type = float32
                }
                Control1 = {
                    DataSource = Logger
                    Type = float32
                }
                Control2 = {
                    DataSource = Logger
                    Type = float32
                }
                Control3 = {
                    DataSource = Logger
                    Type = float32
                }                 
            }
        }
    }
    +Data = {
        Class = ReferenceContainer
        DefaultDataSource = DDB1
        Class = ReferenceContainer
        +Timings = {
            Class = TimingDataSource
        }
        +DDB1 = {
            AllowNoProducers = 1
            Class = GAMDataSource
        }
        +Timer = {
            Class = LinuxTimer
            ExecutionMode = RealTimeThread
            SleepNature = Busy
            SleepPercentage = 70
            Signals = {
                Counter = {
                    Type = uint32 
                }
                Time = {
                    Type = uint32
                }
            } 
        }         
        +UdpReceiver = {
            Class = UDP::UDPReceiver
            InterfaceAddress = "10.0.0.4"
            Port = 7777
            ExecutionMode = RealTimeThread
            Signals = {
                EndSwitches = {
                    Type = uint32
                }         
                Controls = {
                    Type = float32
                    NumberOfElements = 4
                }
                Positions = {
                    Type = int32
                    NumberOfElements = 4
                }
            }            
        }
        +UdpSender = {
            Class = UDP::UDPSender
            Address = "10.0.0.3"
            Port = 8888
            ExecutionMode = RealTimeThread
            Signals = {
                References = {
                    Type = int32
                    NumberOfElements = 4
                }
            }
        }
        +Logger = {
            Class = LoggerDataSource
            CyclePeriod = 10
        }
    }
    +States = {
        Class = ReferenceContainer
        +State1 = {
            Class = RealTimeState
            +Threads = {
                Class = ReferenceContainer
                +Thread1 = {
                    Class = RealTimeThread
                    CPUs = 2
                    Functions = { ReadUDP, Log }
                }
                +Thread2 = {
                    Class = RealTimeThread
                    CPUs = 4
                    Functions = { Motor_Params, Sync, WriteUDP }
                }                 
            }
        }
    }    
    +Scheduler = {
        Class = GAMScheduler
        TimingDataSource = Timings
    }
}
