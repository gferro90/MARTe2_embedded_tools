+HttpServiceA = {
    Class = HttpService
    AcceptTimeout = 1000
    Port = 8084
    Timeout = 0
    MaxNumberOfThreads = 10
    MinNumberOfThreads = 1
    ListenMaxConnections = 255
    WebRoot = WebRoot
    IsTextMode = 1
    ChunkSize = 32
    CPUs = 0x1
}

+StateMachine = {
    Class = StateMachine
    +INITIAL = {
        Class = ReferenceContainer
        +START = {
            Class = StateMachineEvent
            NextState = MANUAL_OPERATION
            NextStateError = MANUAL_OPERATION
            +StartHttpServer = {
                Class = Message
                Destination = HttpServiceA
                Function = Start
                Mode = ExpectsReply
            }             
            +PrepareNextStateMsg = {
                Class = Message
                Destination = EmbeddedInterface
                Mode = ExpectsReply
                Function = PrepareNextState
                +Parameters = {
                    Class = ConfigurationDatabase
                    param1 = ManualOperation
                }
            }
            +StartNextStateExecutionMsg = {
                Class = Message
                Destination = EmbeddedInterface
                Function = StartNextStateExecution
                Mode = ExpectsReply
            }
        }
    }
    +HOME = {
        Class = ReferenceContainer
        +GO_TO_MANUAL_OPERATION = {
            Class = StateMachineEvent
            NextState = MANUAL_OPERATION
            NextStateError = MANUAL_OPERATION
            +PrepareNextStateMsg = {
                Class = Message
                Destination = EmbeddedInterface
                Mode = ExpectsReply
                Function = PrepareNextState
                +Parameters = {
                    Class = ConfigurationDatabase
                    param1 = ManualOperation
                }
            }
            +StartNextStateExecutionMsg = {
                Class = Message
                Destination = EmbeddedInterface
                Function = StartNextStateExecution
                Mode = ExpectsReply
            }
        }
    }
    +MANUAL_OPERATION = {
        Class = ReferenceContainer
        +GO_TO_HOME = {
            Class = StateMachineEvent
            NextState = HOME
            NextStateError = HOME
            +PrepareNextStateMsg = {
                Class = Message
                Destination = EmbeddedInterface
                Mode = ExpectsReply
                Function = PrepareNextState
                +Parameters = {
                    Class = ConfigurationDatabase
                    param1 = Home
                }
            }
            +StartNextStateExecutionMsg = {
                Class = Message
                Destination = EmbeddedInterface
                Function = StartNextStateExecution
                Mode = ExpectsReply
            }
        }
    }        
}


