+WebRoot = {
    Class = HttpObjectBrowser
    Root = "."
    CPUs = 0x1
    +ObjectBrowse = {
        Class = HttpObjectBrowser
        Root = "/"
    }
    +ResourcesHtml = {
        Class = HttpDirectoryResource
        // BaseDir = "./MARTe2/Resources/HTTP"
        BaseDir = "/home/giuseppe/FullProject/MARTe2/Resources/HTTP"
    }
    +HttpMonitor_MotorPosition = {
        Class = HttpDataMonitor
        Plot1 = {
            Reference_0 = {
                Component = "EmbeddedInterface.Functions.Motor_Params"
                Signal = "OutputSignals.ReferencePos0"
            }
            Position_0 = {
                Component = "EmbeddedInterface.Functions.ReadUDP"
                Signal = "OutputSignals.MeasuredPos0"
            }
        }
        Plot2 = {
            Reference_1 = {
                Component = "EmbeddedInterface.Functions.Motor_Params"
                Signal = "OutputSignals.ReferencePos1"
            }
            Position_1 = {
                Component = "EmbeddedInterface.Functions.ReadUDP"
                Signal = "OutputSignals.MeasuredPos1"
            }
        }
        Plot3 = {
            Reference_2 = {
                Component = "EmbeddedInterface.Functions.Motor_Params"
                Signal = "OutputSignals.ReferencePos2"
            }
            Position_2 = {
                Component = "EmbeddedInterface.Functions.ReadUDP"
                Signal = "OutputSignals.MeasuredPos2"
            }
        }
        Plot4 = {
            Reference_3 = {
                Component = "EmbeddedInterface.Functions.Motor_Params"
                Signal = "OutputSignals.ReferencePos3"
            }
            Position_3 = {
                Component = "EmbeddedInterface.Functions.ReadUDP"
                Signal = "OutputSignals.MeasuredPos3"
            }
        }        
    }
    +HttpMessageInterface_Motors = {
        Class = HttpMessageInterface
        +Reference0 = {
            Class = Message
            Destination = EmbeddedInterface.Functions.Motor_Params
            Function = SetOutput
            +Parameters = {
                Class = ConfigurationDatabase
                SignalName = ReferencePos0
                SignalValue = $1
            }
        }
        +Reference1 = {
            Class = Message
            Destination = EmbeddedInterface.Functions.Motor_Params
            Function = SetOutput
            +Parameters = {
                Class = ConfigurationDatabase
                SignalName = ReferencePos1
                SignalValue = $1
            }
        }
        +Reference2 = {
            Class = Message
            Destination = EmbeddedInterface.Functions.Motor_Params
            Function = SetOutput
            +Parameters = {
                Class = ConfigurationDatabase
                SignalName = ReferencePos2
                SignalValue = $1
            }
        }
        +Reference3 = {
            Class = Message
            Destination = EmbeddedInterface.Functions.Motor_Params
            Function = SetOutput
            +Parameters = {
                Class = ConfigurationDatabase
                SignalName = ReferencePos3
                SignalValue = $1
            }
        }        
