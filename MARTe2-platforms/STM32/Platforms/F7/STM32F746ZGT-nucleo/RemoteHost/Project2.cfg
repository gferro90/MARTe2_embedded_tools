    +Data = {
        Class = ReferenceContainer
        DefaultDataSource = DDB1
        Class = ReferenceContainer
        +Timings = {
            Class = TimingDataSource
        }
        +DDB1 = {
            AllowNoProducers = 1
            Class = GAMDataSource
        }
        +Timer = {
            Class = LinuxTimer
            ExecutionMode = RealTimeThread
            SleepNature = Busy
            SleepPercentage = 70
            Signals = {
                Counter = {
                    Type = uint32 
                }
                Time = {
                    Type = uint32
                }
            } 
        }         
        +UdpReceiver = {
            Class = UDP::UDPReceiver
            InterfaceAddress = "10.0.0.4"
            Port = 7777
            ExecutionMode = RealTimeThread
            Signals = {
                EndSwitches = {
                    Type = uint32
                }         
                Controls = {
                    Type = float32
                    NumberOfElements = 5
                }
                Positions = {
                    Type = int32
                    NumberOfElements = 5
                }
            }            
        }
        +UdpSender = {
            Class = UDP::UDPSender
            Address = "10.0.0.3"
            Port = 8888
            ExecutionMode = RealTimeThread
            Signals = {
                References = {
                    Type = int32
                    NumberOfElements = 5
                }
            }
        }
        +Logger = {
            Class = LoggerDataSource
            CyclePeriod = 10
        }
    }
    +States = {
        Class = ReferenceContainer
        +Home = {
            Class = RealTimeState
            +Threads = {
                Class = ReferenceContainer
                +Thread1 = {
                    Class = RealTimeThread
                    CPUs = 2
                    Functions = { ReadUDP, Log, Home, WriteUDP }
                }                 
            }
        }
        +ManualOperation = {
            Class = RealTimeState
            +Threads = {
                Class = ReferenceContainer
                +Thread1 = {
                    Class = RealTimeThread
                    CPUs = 2
                    Functions = { ReadUDP, Log }
                }
                +Thread2 = {
                    Class = RealTimeThread
                    CPUs = 4
                    Functions = { Motor_Params, Sync, WriteUDP }
                }                 
            }
        }
    }    
    +Scheduler = {
        Class = FastScheduler
        NoWait = 1
        TimingDataSource = Timings
    }
}
