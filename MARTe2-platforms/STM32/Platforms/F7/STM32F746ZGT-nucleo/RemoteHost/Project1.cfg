    +Data = {
        Class = ReferenceContainer
        DefaultDataSource = DDB1
        Class = ReferenceContainer
        +Timings = {
            Class = TimingDataSource
        }
        +DDB1 = {
            AllowNoProducers = 1
            Class = GAMDataSource
        }
        +Timer = {
            Class = LinuxTimer
            ExecutionMode = RealTimeThread
            SleepNature = Busy
            SleepPercentage = 70
            Signals = {
                Counter = {
                    Type = uint32 
                }
                Time = {
                    Type = uint32
                }
            } 
        }             
        +SystemTime = {
            Class = ShellCommandDataSource::ShellCommandInput
            Command = "date +'%s%N'"
            Signals = {
                Timestamp = {
                    Type = uint64
                }
            }
        }        
        +Mqtt = {
            Class = MosquittoDataSource::MosquittoPublisher
            Topic = ADC
            Signals = {
                AdcChannel3 = {
                    Type = uint16
                }
                AdcChannel6 = {
                    Type = uint16
                }
                AdcChannel9 = {
                    Type = uint16
                }
                AdcChannel10 = {
                    Type = uint16
                } 
            }            
        }              
        +UdpReceiver = {
            Class = UDP::UDPReceiver
            InterfaceAddress = "10.0.0.4"
            Port = 7777
            ExecutionMode = RealTimeThread
            Signals = {
                DigitalInputs = {
                    Type = uint32
                }            
                Channel3 = {
                    Type = uint16
                }
                Channel6 = {
                    Type = uint16
                }
                Channel9 = {
                    Type = uint16
                }
                Channel10 = {
                    Type = uint16
                }
            }            
        }
        +UdpSender = {
            Class = UDP::UDPSender
            Address = "10.0.0.3"
            Port = 8888
            ExecutionMode = RealTimeThread
            Signals = {
                Amplitude = {
                    Type = float32
                    NumberOfDimensions = 1
                    NumberOfElements = 2                    
                }
                Phase = {
                    Type = float32
                    NumberOfDimensions = 1
                    NumberOfElements = 2                    
                }
                Offset = {
                    Type = float32
                    NumberOfDimensions = 1
                    NumberOfElements = 2                    
                }
                Frequency = {
                    Type = float32
                    NumberOfDimensions = 1
                    NumberOfElements = 2                    
                }
                GPIO_Outputs_E = {
                    Type = uint32
                }
            }
        }
        +Logger = {
            Class = LoggerDataSource
        }
    }
    +States = {
        Class = ReferenceContainer
        +State1 = {
            Class = RealTimeState
            +Threads = {
                Class = ReferenceContainer
                +Thread1 = {
                    Class = RealTimeThread
                    CPUs = 2
                    Functions = { ReadUDP, ExpandDigitalOut, WriteToMqtt }
                }
                +Thread2 = {
                    Class = RealTimeThread
                    CPUs = 4
                    Functions = { Sine0_Params, Sine1_Params, GPIO_Outputs, Sync, CompactDigitalIn, WriteUDP }
                }                
            }
        }
    }    
    +Scheduler = {
        Class = GAMScheduler
        TimingDataSource = Timings
    }
