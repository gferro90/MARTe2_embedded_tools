+HttpServiceA = {
    Class = HttpService
    AcceptTimeout = 1000
    Port = 8084
    Timeout = 0
    MaxNumberOfThreads = 10
    MinNumberOfThreads = 1
    ListenMaxConnections = 255
    WebRoot = WebRoot
    IsTextMode = 1
    ChunkSize = 32
    CPUs = 0x1
}

+StateMachine = {
    Class = StateMachine
    +INITIAL = {
        Class = ReferenceContainer
        +START = {
            Class = StateMachineEvent
            NextState = LOOP
            NextStateError = LOOP
            +StartHttpServer = {
                Class = Message
                Destination = HttpServiceA
                Function = Start
                Mode = ExpectsReply
            }             
            +PrepareNextStateMsg = {
                Class = Message
                Destination = EmbeddedInterface
                Mode = ExpectsReply
                Function = PrepareNextState
                +Parameters = {
                    Class = ConfigurationDatabase
                    param1 = State1
                }
            }
            +StartNextStateExecutionMsg = {
                Class = Message
                Destination = EmbeddedInterface
                Function = StartNextStateExecution
                Mode = ExpectsReply
            }
        }
    }
    +LOOP = {
        Class = ReferenceContainer
        +LOOP = {
            Class = StateMachineEvent
            NextState = LOOP
            NextStateError = LOOP
        }
    }
}


