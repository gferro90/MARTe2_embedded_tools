+WebRoot = {
    Class = HttpObjectBrowser
    Root = "."
    CPUs = 0x1
    +ObjectBrowse = {
        Class = HttpObjectBrowser
        Root = "/"
    }
    +ResourcesHtml = {
        Class = HttpDirectoryResource
        // BaseDir = "./MARTe2/Resources/HTTP"
        BaseDir = "/home/giuseppe/FullProject/MARTe2/Resources/HTTP"
    }
    +Monitor = {
        Class = HttpDataMonitor
        Plot1 = {
            Components = {"EmbeddedInterface.Functions.ReadUDP"}
            Signals = {"OutputSignals.AdcChannel9"}
        }
    }    
    +HttpMessageInterface = {
        Class = HttpMessageInterface
        +Amplitude = {
            Class = Message
            Destination = EmbeddedInterface.Functions.ExternalInterface
            Function = SetOutput
            +Parameters = {
                Class = ConfigurationDatabase
                SignalName = Amplitude
                SignalValue = $1
            }
        }
        +Phase = {
            Class = Message
            Destination = EmbeddedInterface.Functions.ExternalInterface
            Function = SetOutput
            +Parameters = {
                Class = ConfigurationDatabase
                SignalName = Phase
                SignalValue = $0
            }
        }
        +Offset = {
            Class = Message
            Destination = EmbeddedInterface.Functions.ExternalInterface
            Function = SetOutput
            +Parameters = {
                Class = ConfigurationDatabase
                SignalName = Offset
                SignalValue = $0
            }
        }
        +Frequency = {
            Class = Message
            Destination = EmbeddedInterface.Functions.ExternalInterface
            Function = SetOutput
            +Parameters = {
                Class = ConfigurationDatabase
                SignalName = Frequency
                SignalValue = $1
            }
        }
    }
}

+HttpServiceA = {
    Class = HttpService
    AcceptTimeout = 1000
    Port = 8084
    Timeout = 0
    MaxNumberOfThreads = 10
    MinNumberOfThreads = 1
    ListenMaxConnections = 255
    WebRoot = WebRoot
    IsTextMode = 1
    ChunkSize = 32
    CPUs = 0x1
}

+StateMachine = {
    Class = StateMachine
    +INITIAL = {
        Class = ReferenceContainer
        +START = {
            Class = StateMachineEvent
            NextState = LOOP
            NextStateError = LOOP
            +StartHttpServer = {
                Class = Message
                Destination = HttpServiceA
                Function = Start
                Mode = ExpectsReply
            }             
            +PrepareNextStateMsg = {
                Class = Message
                Destination = EmbeddedInterface
                Mode = ExpectsReply
                Function = PrepareNextState
                +Parameters = {
                    Class = ConfigurationDatabase
                    param1 = State1
                }
            }
            +StartNextStateExecutionMsg = {
                Class = Message
                Destination = EmbeddedInterface
                Function = StartNextStateExecution
                Mode = ExpectsReply
            }
        }
    }
    +LOOP = {
        Class = ReferenceContainer
        +LOOP = {
            Class = StateMachineEvent
            NextState = LOOP
            NextStateError = LOOP
        }
    }
}


+EmbeddedInterface = {
    Class = RealTimeApplication
    +Functions = {
        Class = ReferenceContainer
        +ExternalInterface = {
            Class = ConstantGAM
            OutputSignals = {
                Amplitude = {
                    Type = float32
                    DataSource = DDB1
                    Default = 1
                }
                Phase = {
                    Type = float32
                    DataSource = DDB1
                    Default = 0
                }
                Offset = {
                    Type = float32
                    DataSource = DDB1
                    Default = 0
                }
                Frequency = {
                    Type = float32
                    DataSource = DDB1
                    Default = 1
                }
            }
        }
        +Sync = {
            Class = IOGAM
            InputSignals = {
                TimerSignal = {
                    DataSource = Timer
                    Frequency = 10.0
                    Type = uint64
                }
            }
            OutputSignals = {
                Timer = {
                    DataSource = DDB1
                    Type = uint64
                }
            }
        }
        +WriteUDP = {
            Class = IOGAM
            InputSignals = {
                Amplitude = {
                    Type = float32
                    DataSource = DDB1
                }
                Phase = {
                    Type = float32
                    DataSource = DDB1
                }
                Offset = {
                    Type = float32
                    DataSource = DDB1
                }
                Frequency = {
                    Type = float32
                    DataSource = DDB1
                }
            }
            OutputSignals = {
                Amplitude = {
                    Type = float32
                    DataSource = UdpSender
                }
                Phase = {
                    Type = float32
                    DataSource = UdpSender
                }
                Offset = {
                    Type = float32
                    DataSource = UdpSender
                }
                Frequency = {
                    Type = float32
                    DataSource = UdpSender
                }
            }
        }
        +ReadUDP = {
            Class = IOGAM
            InputSignals = {
                AdcChannel9 = {
                    DataSource = UdpReceiver
                    Type = uint16
                }
            }
            OutputSignals = {
                AdcChannel9 = {
                    DataSource = DDB1
                    Type = uint16
                }
            }
        }
        +GetSystemTime = {
            Class = IOGAM
            InputSignals = {
                Timestamp = {
                    DataSource = SystemTime
                    Type = uint64
                    Trigger = 1
                }
            }
            OutputSignals = {
                Timestamp = {
                    DataSource = DDB1
                    Type = uint64
                }
            }
        }
        +Log = {
            Class = IOGAM
            InputSignals = {
                AdcChannel9 = {
                    DataSource = DDB1
                    Type = uint16
                }
            }
            OutputSignals = {
                AdcChannel9 = {
                    DataSource = Logger
                    Type = uint16
                }
            }
        }                
        +WriteToInflux = {
            Class = IOGAM
            InputSignals = {
                Timestamp = {
                    DataSource = DDB1
                    Type = uint64
                }            
                AdcChannel9 = {
                    DataSource = DDB1
                    Type = uint16
                }
            }
            OutputSignals = {
                Timestamp = {
                    DataSource = Influx
                    Type = uint64
                }               
                AdcChannel9 = {
                    DataSource = Influx
                    Type = uint16
                }
            }
        }
        +WriteToMqtt = {
            Class = IOGAM
            InputSignals = {
                AdcChannel9 = {
                    DataSource = DDB1
                    Type = uint16
                }
            }
            OutputSignals = {
                AdcChannel9 = {
                    DataSource = Mqtt
                    Type = uint16
                }
            }
        }            
    }
    +Data = {
        Class = ReferenceContainer
        DefaultDataSource = DDB1
        Class = ReferenceContainer
        +Timings = {
            Class = TimingDataSource
        }
        +DDB1 = {
            AllowNoProducers = 1
            Class = GAMDataSource
        }
        +Timer = {
            Class = LinuxTimer
            ExecutionMode = RealTimeThread
            SleepNature = Busy
            SleepPercentage = 70
            Signals = {
                Counter = {
                    Type = uint32 
                }
                Time = {
                    Type = uint32
                }
            } 
        }             
        +SystemTime = {
            Class = ShellCommandDataSource::ShellCommandInput
            Command = "date +'%s%N'"
            Signals = {
                Timestamp = {
                    Type = uint64
                }
            }
        }        
        +Influx = {
            Class = InfluxDbDataSource::InfluxDbWriter
            Measure = ADC
            +Protocol = {
                Class = InfluxWriteHTTP
                Database = home
                IpAddress = "127.0.0.1"
                Port = 8086
                User = grafana
                Password = grafana
            }
            Signals = {
                Timestamp = {
                    DataSource = Influx
                    Type = uint64
                }  
                AdcChannel9 = {
                    Type = uint16
                }
            }            
        }    
        +Mqtt = {
            Class = MosquittoDataSource::MosquittoPublisher
            Topic = ADC
            Signals = {
                AdcChannel9 = {
                    Type = uint16
                }
            }            
        }              
        +UdpReceiver = {
            Class = UDP::UDPReceiver
            InterfaceAddress = "10.0.0.4"
            Port = 7777
            ExecutionMode = RealTimeThread
            Signals = {
                AdcChannel9 = {
                    Type = uint16
                }
            }            
        }
        +UdpSender = {
            Class = UDP::UDPSender
            Address = "10.0.0.3"
            Port = 8888
            ExecutionMode = RealTimeThread
            Signals = {
                Amplitude = {
                    Type = float32
                }
                Phase = {
                    Type = float32
                }
                Offset = {
                    Type = float32
                }
                Frequency = {
                    Type = float32
                }
            }
        }
        +Logger = {
            Class = LoggerDataSource
        }
    }
    +States = {
        Class = ReferenceContainer
        +State1 = {
            Class = RealTimeState
            +Threads = {
                Class = ReferenceContainer
                +Thread1 = {
                    Class = RealTimeThread
                    CPUs = 2
                    Functions = { ReadUDP, GetSystemTime, Log, WriteToInflux, WriteToMqtt }
                }
                +Thread2 = {
                    Class = RealTimeThread
                    CPUs = 4
                    Functions = { ExternalInterface, Sync, WriteUDP }
                }                
            }
        }
    }    
    +Scheduler = {
        Class = GAMScheduler
        TimingDataSource = Timings
    }
}