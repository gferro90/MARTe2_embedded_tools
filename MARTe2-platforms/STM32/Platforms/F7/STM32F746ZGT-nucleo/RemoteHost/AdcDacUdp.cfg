
+StateMachine = {
    Class = StateMachine
    +INITIAL = {
        Class = ReferenceContainer
        +START = {
            Class = StateMachineEvent
            NextState = LOOP
            NextStateError = LOOP
            +PrepareNextStateMsg = {
                Class = Message
                Destination = EmbeddedInterface
                Mode = ExpectsReply
                Function = PrepareNextState
                +Parameters = {
                    Class = ConfigurationDatabase
                    param1 = State1
                }
            }
            +StartNextStateExecutionMsg = {
                Class = Message
                Destination = EmbeddedInterface
                Function = StartNextStateExecution
                Mode = ExpectsReply
            }
        }
    }
    +LOOP = {
        Class = ReferenceContainer
        +LOOP = {
            Class = StateMachineEvent
            NextState = LOOP
            NextStateError = LOOP
        }
    }
}


+EmbeddedInterface = {
    Class = RealTimeApplication
    +Functions = {
        Class = ReferenceContainer
        +ReadUDP = {
            Class = IOGAM
            InputSignals = {
                Timer = {
                    DataSource = UdpReceiver
                    Type = uint32
                }
                AdcChannel9 = {
                    DataSource = UdpReceiver
                    Type = uint16
                }
                AdcChannel10 = {
                    DataSource = UdpReceiver
                    Type = uint16
                }
                Counter = {
                    DataSource = UdpReceiver
                    Type = uint16
                }
            }
            OutputSignals = {
                Timer = {
                    DataSource = DDB1
                    Type = uint32
                }
                AdcChannel9 = {
                    DataSource = DDB1
                    Type = uint16
                }
                AdcChannel10 = {
                    DataSource = DDB1
                    Type = uint16
                }
                Counter = {
                    DataSource = DDB1
                    Type = uint16
                }
            }
        }
        +GetSystemTime = {
            Class = IOGAM
            InputSignals = {
                Timestamp = {
                    DataSource = SystemTime
                    Type = uint64
                    Trigger = 1
                }
            }
            OutputSignals = {
                Timestamp = {
                    DataSource = DDB1
                    Type = uint64
                }
            }
        }
        +Log = {
            Class = IOGAM
            InputSignals = {
                Timestamp = {
                    DataSource = DDB1
                    Type = uint64
                }            
                Timer = {
                    DataSource = DDB1
                    Type = uint32
                }
                AdcChannel9 = {
                    DataSource = DDB1
                    Type = uint16
                }
                AdcChannel10 = {
                    DataSource = DDB1
                    Type = uint16
                }
                Counter = {
                    DataSource = DDB1
                    Type = uint16
                }            
            }
            OutputSignals = {
                Timestamp = {
                    DataSource = Logger
                    Type = uint64
                }               
                Timer = {
                    DataSource = Logger
                    Type = uint32
                }
                AdcChannel9 = {
                    DataSource = Logger
                    Type = uint16
                }
                AdcChannel10 = {
                    DataSource = Logger
                    Type = uint16
                }
                Counter = {
                    DataSource = Logger
                    Type = uint16
                }            
            }
        }                
        +WriteToInflux = {
            Class = IOGAM
            InputSignals = {
                Timestamp = {
                    DataSource = DDB1
                    Type = uint64
                }            
                Timer = {
                    DataSource = DDB1
                    Type = uint32
                }
                AdcChannel9 = {
                    DataSource = DDB1
                    Type = uint16
                }
                AdcChannel10 = {
                    DataSource = DDB1
                    Type = uint16
                }
                Counter = {
                    DataSource = DDB1
                    Type = uint16
                }            
            }
            OutputSignals = {
                Timestamp = {
                    DataSource = Influx
                    Type = uint64
                }               
                Timer = {
                    DataSource = Influx
                    Type = uint32
                }
                AdcChannel9 = {
                    DataSource = Influx
                    Type = uint16
                }
                AdcChannel10 = {
                    DataSource = Influx
                    Type = uint16
                }
                Counter = {
                    DataSource = Influx
                    Type = uint16
                }            
            }
        }
        +WriteToMqtt = {
            Class = IOGAM
            InputSignals = {
                Timer = {
                    DataSource = DDB1
                    Type = uint32
                }
                AdcChannel9 = {
                    DataSource = DDB1
                    Type = uint16
                }
                AdcChannel10 = {
                    DataSource = DDB1
                    Type = uint16
                }
                Counter = {
                    DataSource = DDB1
                    Type = uint16
                }            
            }
            OutputSignals = {
                Timer = {
                    DataSource = Mqtt
                    Type = uint32
                }
                AdcChannel9 = {
                    DataSource = Mqtt
                    Type = uint16
                }
                AdcChannel10 = {
                    DataSource = Mqtt
                    Type = uint16
                }
                Counter = {
                    DataSource = Mqtt
                    Type = uint16
                }                
            }
        }            
    }
    +Data = {
        Class = ReferenceContainer
        DefaultDataSource = DDB1
        Class = ReferenceContainer
        +Timings = {
            Class = TimingDataSource
        }
        +DDB1 = {
            AllowNoProducers = 1
            Class = GAMDataSource
        }
        +SystemTime = {
            Class = ShellCommandDataSource::ShellCommandInput
            Command = "date +'%s%N'"
            Signals = {
                Timestamp = {
                    Type = uint64
                }
            }
        }        
        +Influx = {
            Class = InfluxDbDataSource::InfluxDbWriter
            Measure = ADC
            +Protocol = {
                Class = InfluxWriteHTTP
                Database = home
                IpAddress = "127.0.0.1"
                Port = 8086
                User = grafana
                Password = grafana
            }
            Signals = {
               Timestamp = {
                   DataSource = Influx
                   Type = uint64
               }  
               Timer = {
                   Type = uint32
               }
               AdcChannel9 = {
                   Type = uint16
               }
               AdcChannel10 = {
                   Type = uint16
               }
               Counter = {
                   Type = uint16
               }                              
            }            
        }    
        +Mqtt = {
            Class = MosquittoDataSource::MosquittoPublisher
            Topic = ADC
            Signals = {
               Timer = {
                   Type = uint32
               }
               AdcChannel9 = {
                   Type = uint16
               }
               AdcChannel10 = {
                   Type = uint16
               }
               Counter = {
                   Type = uint16
               }                              
            }            
        }              
        +UdpReceiver = {
            Class = UDP::UDPReceiver
            InterfaceAddress = "10.0.0.4"
            Port = 8889
            ExecutionMode = RealTimeThread
            Signals = {
               Timer = {
                   Type = uint32
               }
               AdcChannel9 = {
                   Type = uint16
               }
               AdcChannel10 = {
                   Type = uint16
               }
               Counter = {
                   Type = uint16
               }                              
            }            
        }
        +Logger = {
            Class = LoggerDataSource
        }
    }
    +States = {
        Class = ReferenceContainer
        +State1 = {
            Class = RealTimeState
            +Threads = {
                Class = ReferenceContainer
                +Thread1 = {
                    Class = RealTimeThread
                    CPUs = 2
                    Functions = { ReadUDP, GetSystemTime, Log, WriteToInflux, WriteToMqtt }
                }
            }
        }
    }    
    +Scheduler = {
        Class = GAMScheduler
        TimingDataSource = Timings
    }
}