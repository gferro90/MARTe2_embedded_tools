+WebRoot = {
    Class = HttpObjectBrowser
    Root = "."
    CPUs = 0x1
    +ObjectBrowse = {
        Class = HttpObjectBrowser
        Root = "/"
    }
    +ResourcesHtml = {
        Class = HttpDirectoryResource
        // BaseDir = "./MARTe2/Resources/HTTP"
        BaseDir = "/home/giuseppe/FullProject/MARTe2/Resources/HTTP"
    }
    +HttpMessageInterface = {
        Class = HttpMessageInterface
        +Amplitude = {
            Class = Message
            Destination = EmbeddedInterface.Functions.ExternalInterface
            Function = SetOutput
            +Parameters = {
                Class = ConfigurationDatabase
                SignalName = Amplitude
                SignalValue = $1
            }
        }
        +Phase = {
            Class = Message
            Destination = EmbeddedInterface.Functions.ExternalInterface
            Function = SetOutput
            +Parameters = {
                Class = ConfigurationDatabase
                SignalName = Phase
                SignalValue = $0
            }
        }
        +Offset = {
            Class = Message
            Destination = EmbeddedInterface.Functions.ExternalInterface
            Function = SetOutput
            +Parameters = {
                Class = ConfigurationDatabase
                SignalName = Offset
                SignalValue = $0
            }
        }
        +Frequency = {
            Class = Message
            Destination = EmbeddedInterface.Functions.ExternalInterface
            Function = SetOutput
            +Parameters = {
                Class = ConfigurationDatabase
                SignalName = Frequency
                SignalValue = $1
            }
        }
    }
}

+HttpServiceA = {
    Class = HttpService
    AcceptTimeout = 1000
    Port = 8084
    Timeout = 0
    MaxNumberOfThreads = 10
    MinNumberOfThreads = 1
    ListenMaxConnections = 255
    WebRoot = WebRoot
    IsTextMode = 1
    ChunkSize = 32
    CPUs = 0x1
}


+StateMachine = {
    Class = StateMachine
    +INITIAL = {
        Class = ReferenceContainer
        +START = {
            Class = StateMachineEvent
            NextState = LOOP
            NextStateError = LOOP
            +StartHttpServer = {
                Class = Message
                Destination = HttpServiceA
                Function = Start
                Mode = ExpectsReply
            }         
            +PrepareNextStateMsg = {
                Class = Message
                Destination = EmbeddedInterface
                Mode = ExpectsReply
                Function = PrepareNextState
                +Parameters = {
                    Class = ConfigurationDatabase
                    param1 = State1
                }
            }
            +StartNextStateExecutionMsg = {
                Class = Message
                Destination = EmbeddedInterface
                Function = StartNextStateExecution
                Mode = ExpectsReply
            }
        }
    }
    +LOOP = {
        Class = ReferenceContainer
        +LOOP = {
            Class = StateMachineEvent
            NextState = LOOP
            NextStateError = LOOP
        }
    }
}


+EmbeddedInterface = {
    Class = RealTimeApplication
    +Functions = {
        Class = ReferenceContainer
        +ExternalInterface = {
            Class = ConstantGAM
            OutputSignals = {
               Amplitude = {
                   Type = float32
                   DataSource = DDB1
                   Default = 1
               }
               Phase = {
                   Type = float32
                   DataSource = DDB1
                   Default = 0
               }
               Offset = {
                   Type = float32
                   DataSource = DDB1
                   Default = 0
               }
               Frequency = {
                   Type = float32
                   DataSource = DDB1
                   Default = 1
               }
            }
        }
        +Sync = {
            Class = IOGAM
            InputSignals = {
                Counter = {
                    Type = uint32
                    DataSource = Timer
                    Frequency = 10
                }
            }
            OutputSignals = {
                Counter = {
                    Type = uint32
                    DataSource = Logger
                }            
            }
        }
        +WriteUDP = {
            Class = IOGAM
            InputSignals = {
                Amplitude = {
                    Type = float32
                    DataSource = DDB1
                }
                Phase = {
                    Type = float32
                    DataSource = DDB1
                }
                Offset = {
                    Type = float32
                    DataSource = DDB1
                }
                Frequency = {
                    Type = float32
                    DataSource = DDB1
                }
            }
            OutputSignals = {
                Amplitude = {
                    Type = float32
                    DataSource = UdpSender
                }
                Phase = {
                    Type = float32
                    DataSource = UdpSender
                }
                Offset = {
                    Type = float32
                    DataSource = UdpSender
                }
                Frequency = {
                    Type = float32
                    DataSource = UdpSender
                }
            }
        }
    }
    +Data = {
        Class = ReferenceContainer
        DefaultDataSource = DDB1
        Class = ReferenceContainer
        +Timings = {
            Class = TimingDataSource
        }
        +DDB1 = {
            AllowNoProducers = 1
            Class = GAMDataSource
        }
        +UdpSender = {
            Class = UDP::UDPSender
            Address = "10.0.0.3"
            Port = 8888
            ExecutionMode = RealTimeThread
            Signals = {
                Amplitude = {
                    Type = float32
                }
                Phase = {
                    Type = float32
                }
                Offset = {
                    Type = float32
                }
                Frequency = {
                    Type = float32
                }
            }
        }
        +Logger = {
            Class = LoggerDataSource
        }
        +Timer = {
            Class = LinuxTimer
            ExecutionMode = RealTimeThread
            SleepNature = Busy
            SleepPercentage = 70
            Signals = {
                Counter = {
                    Type = uint32 
                }
                Time = {
                    Type = uint32
                }
            } 
        }        
    }
    +States = {
        Class = ReferenceContainer
        +State1 = {
            Class = RealTimeState
            +Threads = {
                Class = ReferenceContainer
                +Thread1 = {
                    Class = RealTimeThread
                    CPUs = 2
                    Functions = { ExternalInterface, Sync, WriteUDP }
                }
            }
        }
    }    
    +Scheduler = {
        Class = GAMScheduler
        TimingDataSource = Timings
    }
}